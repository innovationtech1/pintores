 <script src="script.js"></script>

    <section>
        <div id="contacto" class="calculadora-container">
  <h2>Calculadora de Presupuesto Estimado</h2>
  <p>Ingresa los datos de tu espacio para obtener un costo aproximado (material y mano de obra).</p>

  <div class="calc-group">
    <label for="metros">Metros cuadrados a pintar (m²):</label>
    <input type="number" id="metros" placeholder="Ej. 50" min="1">
  </div>

  <div class="calc-group">
    <label for="calidad">Calidad de la pintura:</label>
    <select id="calidad">
      <option value="estandar">Estándar (Económica pero duradera)</option>
      <option value="premium">Premium (Mejor cobertura y lavable)</option>
    </select>
  </div>

  <div class="calc-group">
    <label for="area">Tipo de área:</label>
    <select id="area">
      <option value="interior">Interior</option>
      <option value="exterior">Exterior (Requiere pintura resistente al clima)</option>
    </select>
  </div>

  <button class="btn-calcular" onclick="calcularPresupuesto()">Calcular Precio</button>



<div id="resultado-presupuesto" class="resultado-oculto">
  <h3>Costo Estimado: <span id="precio-total">$0</span></h3>
</div>

  </body>
